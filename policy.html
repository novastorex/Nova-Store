<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوثيقة القانونية - Nova Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main-bg: #0d1117; --neon-blue: #00d4ff; --gold: #ffcc00; --card-bg: #161b22; --text-gray: #8b949e; }
        body { margin: 0; padding: 0; background-color: var(--main-bg); font-family: 'Tajawal', sans-serif; color: white; line-height: 1.8; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; background: #0d1117; border-bottom: 2px solid var(--neon-blue); position: sticky; top: 0; z-index: 1000; }
        .pill-select { background: #21262d; border: 1px solid #30363d; border-radius: 15px; padding: 5px 10px; color: white; cursor: pointer; outline: none; }

        .container { padding: 40px 5%; max-width: 1000px; margin: auto; }
        .hero-header { text-align: center; margin-bottom: 50px; }
        .hero-header h1 { color: var(--gold); font-size: 32px; text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .hero-header p { color: var(--text-gray); font-size: 16px; }

        /* Sections */
        .policy-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; padding: 30px; margin-bottom: 25px; position: relative; overflow: hidden; }
        .policy-card::before { content: ""; position: absolute; top: 0; right: 0; width: 5px; height: 100%; background: var(--neon-blue); }
        .policy-card h2 { color: var(--neon-blue); font-size: 22px; margin-top: 0; display: flex; align-items: center; gap: 12px; }
        .policy-card i { font-size: 20px; color: var(--gold); }
        
        .content-block { margin-top: 15px; }
        .content-block h3 { color: #fff; font-size: 17px; margin-bottom: 10px; border-bottom: 1px solid #30363d; display: inline-block; }
        .content-block p, .content-block li { color: var(--text-gray); font-size: 14.5px; margin-bottom: 12px; }
        
        .warning-box { background: rgba(255, 75, 75, 0.1); border: 1px solid #ff4b4b; border-radius: 10px; padding: 15px; color: #ff4b4b; font-weight: bold; margin: 20px 0; font-size: 14px; }

        .footer { text-align: center; padding: 40px 0; border-top: 1px solid #30363d; margin-top: 50px; }
        .btn-home { background: linear-gradient(90deg, var(--gold), #e6b800); color: black; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2); }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4); }

        /* LTR Logic */
        [dir="ltr"] .policy-card::before { right: auto; left: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div onclick="history.back()" style="font-size: 20px; cursor: pointer;">🔙</div>
        <select class="pill-select" id="lang" onchange="toggleLang()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>
        <img src="https://i.ibb.co/5xXyd4jN/1774783408791.png" height="35">
    </div>

    <div class="container" id="contentArea">
        </div>

    <div class="footer">
        <a href="index.html" class="btn-home" id="homeBtn">العودة للرئيسية</a>
    </div>

    <script>
        const content = {
            ar: {
                title: "اتفاقية الاستخدام والخصوصية الشاملة",
                sub: "وثيقة قانونية تنظم العلاقة بين 'نوفا ستور' والعميل",
                btn: "العودة للرئيسية",
                sections: [
                    {
                        icon: "fa-gavel",
                        title: "1. أحكام عامة وشروط الأهلية",
                        text: `باستخدامك لخدمات Nova Store، فإنك تقر بأنك قد بلغت السن القانوني أو تملك موافقة من ولي أمرك لإتمام عمليات الشراء. 
                        المتجر مخصص لتقديم خدمات ومنتجات رقمية (Roblox Assets) ولا يتبع رسمياً لشركة Roblox، بل نحن موفرون مستقلون لهذه السلع.`
                    },
                    {
                        icon: "fa-shield-halved",
                        title: "2. مسؤولية الحسابات والسلع الرقمية",
                        text: `بمجرد استلامك للحساب أو السلعة وتغيير بيانات الدخول، تنتقل المسؤولية الكاملة إليك. 
                        المتجر غير مسؤول عن أي "باند" (Ban) ناتج عن سوء استخدام العميل أو مخالفة سياسات اللعبة بعد التسليم. 
                        نحن نضمن أن السلعة تعمل بنسبة 100% لحظة التسليم فقط.`
                    },
                    {
                        icon: "fa-box-open",
                        title: "3. سياسة البيع والتعويض الصارمة",
                        text: `نظراً لأن المنتجات رقمية وغير قابلة للاسترداد مادياً، فإنه لا يوجد نظام "استرجاع مالي" بعد التسليم. 
                        <div class="warning-box">يجب على العميل تصوير فيديو يبدأ من لحظة الشراء حتى تجربة الحساب دون انقطاع، وبدون هذا الفيديو يسقط الحق في أي مطالبة بالتعويض في حال وجود خلل.</div>
                        التعويض يتم فقط في حال أثبت الفيديو وجود خطأ من طرفنا، ويكون عبر استبدال المنتج بآخر مماثل.`
                    },
                    {
                        icon: "fa-user-secret",
                        title: "4. حماية البيانات والخصوصية",
                        text: `نحن نطبق معايير أمان عالية. لا نقوم بمشاركة أرقام هواتف العملاء أو محادثاتهم مع أي أطراف ثالثة. 
                        يتم الاحتفاظ بسجلات المحادثات لغرض ضمان الحقوق في حال نشوب خلاف فقط، ثم يتم أرشفتها بشكل آمن.`
                    },
                    {
                        icon: "fa-ban",
                        title: "5. السلوك المحظور والعقوبات",
                        text: `يحق لـ Nova Store حظر أي عميل (Blacklist) ومنعه من التعامل مع المتجر مستقبلاً في حالات: 
                        السب أو الإساءة لطاقم الدعم، محاولة الاحتيال عبر صور مفبركة، أو التشهير بالمتجر دون وجه حق. 
                        المتجر يحتفظ بحقه القانوني في ملاحقة أي محاولة إضرار بسمعة المنصة.`
                    }
                ]
            },
            en: {
                title: "Comprehensive Terms & Privacy Agreement",
                sub: "Legal document regulating the relationship between Nova Store and the customer",
                btn: "Back to Home",
                sections: [
                    {
                        icon: "fa-gavel",
                        title: "1. General Provisions & Eligibility",
                        text: `By using Nova Store services, you acknowledge that you are of legal age or have guardian consent. 
                        Nova Store provides digital Roblox assets independently and is not officially affiliated with Roblox Corp.`
                    },
                    {
                        icon: "fa-shield-halved",
                        title: "2. Responsibility for Digital Assets",
                        text: `Once you receive the account/item and change login credentials, full responsibility shifts to you. 
                        Nova Store is not responsible for any bans resulting from misuse or game policy violations after delivery. 
                        We guarantee functionality 100% ONLY at the moment of delivery.`
                    },
                    {
                        icon: "fa-box-open",
                        title: "3. Strict Sales & Compensation Policy",
                        text: `Since products are digital and non-returnable, there is NO refund system after delivery. 
                        <div class="warning-box">Customers MUST record a continuous video from the moment of purchase until testing the account. Without this video, no compensation claims will be accepted.</div>
                        Compensation is only granted if the video proves a fault from our side, via product replacement.`
                    },
                    {
                        icon: "fa-user-secret",
                        title: "4. Data Protection & Privacy",
                        text: `We apply high security standards. Customer phone numbers and conversations are never shared with third parties. 
                        Chat logs are kept only to secure rights in case of disputes and are then archived securely.`
                    },
                    {
                        icon: "fa-ban",
                        title: "5. Prohibited Conduct & Penalties",
                        text: `Nova Store reserves the right to blacklist any customer in cases of: 
                        Harassment of support staff, attempted fraud via faked screenshots, or baseless defamation. 
                        We reserve the legal right to pursue any attempts to damage the store's reputation.`
                    }
                ]
            }
        };

        function toggleLang() {
            const lang = document.getElementById('lang').value;
            const data = content[lang];
            const htmlTag = document.getElementById('htmlTag');
            
            htmlTag.dir = lang === 'ar' ? 'rtl' : 'ltr';
            htmlTag.lang = lang;

            let html = `
                <div class="hero-header">
                    <h1>${data.title}</h1>
                    <p>${data.sub}</p>
                </div>
            `;

            data.sections.forEach(s => {
                html += `
                    <div class="policy-card">
                        <h2><i class="fas ${s.icon}"></i> ${s.title}</h2>
                        <div class="content-block">
                            <p>${s.text}</p>
                        </div>
                    </div>
                `;
            });

            document.getElementById('contentArea').innerHTML = html;
            document.getElementById('homeBtn').innerText = data.btn;
        }

        // Initialize
        toggleLang();
    </script>
</body>
</html>
