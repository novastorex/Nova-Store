<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Nova Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main-bg: #0d1117; --neon-blue: #00d4ff; --gold: #ffcc00; --card-bg: #161b22; --text-gray: #8b949e; }
        body { margin: 0; padding: 0; background-color: var(--main-bg); font-family: 'Tajawal', sans-serif; color: white; min-height: 100vh; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; background: #0d1117; border-bottom: 2px solid var(--neon-blue); position: sticky; top: 0; z-index: 1000; }
        .pill-select { background: #21262d; border: 1px solid #30363d; border-radius: 15px; padding: 5px 10px; color: white; cursor: pointer; outline: none; }

        .container { padding: 40px 5%; max-width: 800px; margin: auto; text-align: center; }
        .hero-section { margin-bottom: 40px; animation: fadeInDown 0.6s ease; }
        .hero-section h1 { color: var(--gold); font-size: 32px; margin-bottom: 10px; }
        .hero-section p { color: var(--text-gray); font-size: 16px; }

        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .contact-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; padding: 25px; text-decoration: none; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; overflow: hidden; }
        .contact-card:hover { border-color: var(--neon-blue); transform: translateY(-5px); background: #1c2128; box-shadow: 0 10px 20px rgba(0, 212, 255, 0.1); }
        
        .contact-card i { font-size: 40px; }
        .fa-tiktok { color: #fff; }
        .fa-whatsapp { color: #25D366; }
        .fa-telegram { color: #229ED9; }
        .fa-discord { color: #5865F2; }

        .contact-card span { font-weight: bold; font-size: 14px; }
        
        .support-info { margin-top: 50px; background: rgba(0, 212, 255, 0.05); border: 1px dashed var(--neon-blue); border-radius: 15px; padding: 25px; animation: fadeInUp 0.8s ease; }
        .support-info h3 { color: var(--neon-blue); margin-top: 0; }
        .support-info p { font-size: 14px; color: var(--text-gray); line-height: 1.6; }

        .btn-home { display: inline-block; margin-top: 40px; background: var(--gold); color: black; padding: 12px 35px; border-radius: 25px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-home:hover { opacity: 0.8; transform: scale(1.05); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div onclick="history.back()" style="font-size: 20px; cursor: pointer;">🔙</div>
        <select class="pill-select" id="lang" onchange="updateLang()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>
        <img src="https://i.ibb.co/5xXyd4jN/1774783408791.png" height="35">
    </div>

    <div class="container">
        <div class="hero-section">
            <h1 id="title">تواصل معنا</h1>
            <p id="subtitle">نحن هنا لمساعدتك، اختر المنصة المفضلة لديك للتحدث إلينا</p>
        </div>

        <div class="contact-grid">
            <a href="https://www.tiktok.com/@novastoreox?_r=1&_t=ZS-95fx1uWyjd2" class="contact-card" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span id="tk">تيك توك</span>
            </a>

            <a href="https://wa.me/qr/RHBWYWDXBM2UI1" class="contact-card" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span id="wa">واتساب</span>
            </a>

            <a href="https://t.me/Novastoreofficialx" class="contact-card" target="_blank">
                <i class="fab fa-telegram"></i>
                <span id="tg">تيلجرام</span>
            </a>

            <a href="https://discord.gg/zaVYm4zD8X" class="contact-card" target="_blank">
                <i class="fab fa-discord"></i>
                <span id="ds">ديسكورد</span>
            </a>
        </div>

        <div class="support-info">
            <h3 id="infoTitle">ساعات العمل والدعم</h3>
            <p id="infoText">فريق دعم "نوفا ستور" متاح للرد على استفساراتكم وإتمام طلباتكم. نحن نسعى للرد بأسرع وقت ممكن لضمان رضاكم.</p>
        </div>

        <a href="index.html" class="btn-home" id="btnHome">العودة للرئيسية</a>
    </div>

    <script>
        function updateLang() {
            const lang = document.getElementById('lang').value;
            const html = document.getElementById('htmlTag');
            
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';
            html.lang = lang;

            if (lang === 'en') {
                document.getElementById('title').innerText = "Contact Us";
                document.getElementById('subtitle').innerText = "We are here to help, choose your favorite platform";
                document.getElementById('tk').innerText = "TikTok";
                document.getElementById('wa').innerText = "WhatsApp";
                document.getElementById('tg').innerText = "Telegram";
                document.getElementById('ds').innerText = "Discord";
                document.getElementById('infoTitle').innerText = "Support & Hours";
                document.getElementById('infoText').innerText = "The Nova Store support team is available to answer your inquiries and fulfill your orders. We strive to respond as quickly as possible.";
                document.getElementById('btnHome').innerText = "Back to Home";
            } else {
                // العودة للعربية
                document.getElementById('title').innerText = "تواصل معنا";
                document.getElementById('subtitle').innerText = "نحن هنا لمساعدتك، اختر المنصة المفضلة لديك للتحدث إلينا";
                document.getElementById('tk').innerText = "تيك توك";
                document.getElementById('wa').innerText = "واتساب";
                document.getElementById('tg').innerText = "تيلجرام";
                document.getElementById('ds').innerText = "ديسكورد";
                document.getElementById('infoTitle').innerText = "ساعات العمل والدعم";
                document.getElementById('infoText').innerText = "فريق دعم 'نوفا ستور' متاح للرد على استفساراتكم وإتمام طلباتكم. نحن نسعى للرد بأسرع وقت ممكن لضمان رضاكم.";
                document.getElementById('btnHome').innerText = "العودة للرئيسية";
            }
        }
    </script>
</body>
</html>
