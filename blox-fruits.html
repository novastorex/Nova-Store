        // تطبيق اللغة المحفوظة فوراً قبل رسم الصفحة لتجنب الوميض (نفس نظام index.html)
        (function() {
            try {
                const savedLang = localStorage.getItem('selectedLang');
                const html = document.getElementById('mainHtml');
                if (savedLang === 'en') { html.dir = "ltr"; html.lang = "en"; }
                else { html.dir = "rtl"; html.lang = "ar"; }
            } catch(e) {}
        })();
    </script>

            --soft-card: #1c2128;

            --gold: #ffcc00;
            --text-gray: #97a2b0;
            --border: #30363d;
            --success: #4ade80;
            --danger: #ff6b6b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #0d1117 0%, #0b1220 100%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(13,17,23,.96);
            border-bottom: 2px solid var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #21262d;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 7px 12px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: .2s ease;
        }
        .home-btn:hover {
            background: var(--neon-blue);
            color: #00131b;
        }
        .home-btn i { color: var(--gold); }
        .home-btn:hover i { color: #00131b; }
        .logo-img { height: 32px; display: block; }
        .nav-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .pill {
            display: flex;
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 20px;
            height: 32px;
            align-items: center;
            transition: 0.3s;
            overflow: hidden;
        }
        .pill:hover { border-color: var(--neon-blue); }
        .pill select {
            background: transparent;
            color: white;
            border: none;
            padding: 0 10px;
            font-family: 'Tajawal';
            font-size: 11px;
            cursor: pointer;
            outline: none;
            height: 100%;
        }
        .cart-box {
            color: var(--gold);
            font-size: 13px;
            background: rgba(255, 204, 0, 0.08);
            padding: 7px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.25);
            cursor: pointer;
            transition: .2s ease;
        }
        .cart-box:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(255,204,0,.14); }

            padding: 18px 15px 8px;
            background: radial-gradient(circle at top right, rgba(0,212,255,.18), transparent 35%), #111827;

        .hero h1 { margin: 0 0 8px; color: var(--neon-blue); font-size: 24px; }
        .hero p { margin: 0; color: #d1d7df; font-size: 13px; line-height: 1.8; }
        .search-container { padding: 15px; background: #161b22; }
        .search-box { width: 100%; position: relative; }
        .search-box input {
            width: 100%;
            background: #0d1117;
            border: 1.5px solid var(--neon-blue);
            border-radius: 20px;
            padding: 11px 15px;
            color: white;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        [dir="rtl"] .search-box input { padding-right: 38px; }
        [dir="ltr"] .search-box input { padding-left: 38px; }
        .search-box i {
            position: absolute; top: 50%; transform: translateY(-50%); color: var(--neon-blue);
        }
        [dir="rtl"] .search-box i { right: 13px; }
        [dir="ltr"] .search-box i { left: 13px; }
        .filter-container {
            background: #161b22; padding: 10px 6px 12px; display: flex;
            overflow-x: auto; gap: 8px; border-bottom: 1px solid var(--border); scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-opt {
            background: #21262d; border: 1px solid var(--neon-blue); color: white;
            padding: 7px 16px; border-radius: 18px; cursor: pointer; white-space: nowrap;
            font-size: 12px; flex-shrink: 0; transition: .2s ease;
        }
        .filter-opt.active {
            background: var(--neon-blue); color: #000; font-weight: 800;
            box-shadow: 0 0 18px rgba(0,212,255,.28);
        }
        .products-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px; padding: 15px;
        }
        .product-card {
            background: linear-gradient(180deg, rgba(22,27,34,1) 0%, rgba(19,24,31,1) 100%);
            border-radius: 18px; padding: 10px; border: 1px solid var(--border);
            position: relative; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,.2);
        }
        .product-card .thumb-wrap {
            position: relative; border-radius: 14px; overflow: hidden; background: #000;
        }
        .product-card img {
            width: 100%; display: block; object-fit: cover; background: #000;
            aspect-ratio: 1/1;
        }
        .card-info-btn {
            position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5; border: 1px solid var(--neon-blue);
            background: rgba(0,212,255,.18); color: var(--neon-blue);
        }
        .image-badge {
            position: absolute; top: 12px; right: 12px;
            background: linear-gradient(135deg, var(--gold), #ff9500); color: #111;
            font-weight: 800; font-size: 11px; padding: 5px 10px; border-radius: 999px;
            box-shadow: 0 8px 16px rgba(255,204,0,.28); z-index: 3;
        }
        .mini-tag {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 10px; padding: 5px 8px;
            background: rgba(0,212,255,.12); color: var(--neon-blue);
            border: 1px solid rgba(0,212,255,.22); border-radius: 999px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 13px; font-weight: 800; line-height: 1.4;
            min-height: 36px; margin-bottom: 6px;
        }
        .price-line { color: var(--gold); font-weight: 800; margin-bottom: 10px; font-size: 15px; }
        .small-desc {
            color: #cad3dd; font-size: 11px; line-height: 1.7;
            min-height: 36px; margin-bottom: 10px;
        }
        .specs-preview {
            list-style: none; padding: 0; margin: 0 0 10px;
            display: grid; gap: 6px;
        }
        .specs-preview li {
            color: #d5dce5; font-size: 11px;
            background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
            padding: 7px 9px; border-radius: 10px;
        }
        .btn {
            width: 100%; padding: 10px 12px; border: none;
            border-radius: 11px; font-weight: 800; cursor: pointer;
            transition: .2s ease; font-family: inherit;
        }
        .btn-primary { background: var(--neon-blue); color: #00131b; }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary {
            background: rgba(255,255,255,.06); color: #fff;
            border: 1px solid rgba(255,255,255,.08);
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: 20px; background: var(--card-bg);
            border: 1px dashed var(--border); border-radius: 18px;
            text-align: center; color: var(--text-gray);

        .close-modal {

            color: var(--neon-blue); cursor: pointer; position: sticky;

            background: linear-gradient(180deg, #131922 0%, #0f141b 100%);

        .modal-cover {

            background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
            border-radius: 12px; padding: 11px 13px;
            color: #dbe4ee; font-size: 13px;
        }

            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        @media (max-width: 720px) {
            .feature-grid, .cta-row { grid-template-columns: 1fr; }

</head>

                : products.filter(p => p.cat === currentFilter);

            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state">${tx.noResults}</div>`;
                return;
            }

            filtered.forEach((p) => {
                const originalIndex = products.findIndex(item => item.nameAr === p.nameAr && item.cat === p.cat);
                const tag = p.cat === 'pass' ? tx.gamePassTag : (p.cat === 'acc' ? tx.accountTag : '');
                const badge = lang === 'ar' ? p.badgeAr : p.badgeEn;
                const previewSpecs = (lang === 'ar' ? p.specsAr : p.specsEn) || [];
                const shortDesc = (lang === 'ar' ? p.descAr : p.descEn) || '';

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="thumb-wrap">
                            <div class="card-info-btn" onclick="openDetails(${originalIndex})"><i class="fas fa-info"></i></div>
                            ${badge ? `<div class="image-badge">${badge}</div>` : ''}
                            <img src="${p.img}" alt="${lang === 'ar' ? p.nameAr : p.nameEn}">
                        </div>
                        ${tag ? `<div class="mini-tag"><i class="fas fa-bolt"></i>${tag}</div>` : ''}
                        <div class="card-title">${lang === 'ar' ? p.nameAr : p.nameEn}</div>
                        <div class="price-line">${formatPrice(p.price)}</div>
                        ${previewSpecs.length ? `<ul class="specs-preview">${previewSpecs.slice(0,2).map(x => `<li>${x}</li>`).join('')}</ul>` 
                          : (shortDesc ? `<div class="small-desc">${shortDesc.substring(0, 110)}${shortDesc.length>110?'…':''}</div>` : '')}
                        <button class="btn btn-primary" onclick="addProductToCart(${originalIndex})">${tx.add}</button>
                    </div>`;
            });
        }

        // === التفاصيل (modal موحّد لكل الفئات) ===
        function getCategoryLabel(p) {
            const lang = currentLang();
            if (p.cat === 'perm') return lang === 'ar' ? 'فاكهة دائمة' : 'Permanent Fruit';
            if (p.cat === 'normal') return lang === 'ar' ? 'فاكهة عادية' : 'Normal Fruit';
            if (p.cat === 'pass') return lang === 'ar' ? 'قيم باس' : 'Game Pass';
            if (p.cat === 'acc') return lang === 'ar' ? 'حساب Roblox' : 'Roblox Account';
            return lang === 'ar' ? 'خدمة' : 'Service';
        }
        function getServiceDescription(p) {
            const lang = currentLang();
            const d = lang === 'ar' ? p.descAr : p.descEn;
            return (d && d.trim()) ? d : t().serviceNoDesc;
        }
        function openDetails(idx) {
            const p = products[idx];
            if (!p) return;
            const lang = currentLang();
            const tx = t();
            const modalBody = document.getElementById('modalBody');
            const name = lang === 'ar' ? p.nameAr : p.nameEn;
            const specs = lang === 'ar' ? (p.specsAr || []) : (p.specsEn || []);
            const badge = lang === 'ar' ? p.badgeAr : p.badgeEn;

            let descriptionHtml = '';
            if (p.cat === 'srv') {
                const d = lang === 'ar' ? p.descAr : p.descEn;
                if (d && d.trim()) {
                    descriptionHtml = `<p class="detail-text">${d}</p>`;
                } else {
                    descriptionHtml = `<div class="detail-list"><li style="color:var(--text-gray);font-style:italic;">${tx.serviceNoDesc}</li></div>`;
                }
            } else {
                let extraNotes = '';
                if (p.cat === 'acc') {
                    extraNotes = `<p class="detail-text">${lang === 'ar' ? 'الحسابات تُسلم ببيانات الدخول كاملة بعد تأكيد الطلب. يُفضَّل تغيير كلمة المرور فور الاستلام.' : 'Accounts are delivered with full credentials after order confirmation. It is recommended to change the password immediately after receiving the account.'}</p>`;
                } else if (p.cat === 'pass') {
                    extraNotes = `<p class="detail-text">${lang === 'ar' ? 'يمكن تسليم أغلب عناصر هذه الفئة عبر Gift داخل اللعبة أو حسب نوع الطلب.' : 'Most items in this category can be delivered via in-game Gift depending on the order type.'}</p>`;
                }
                descriptionHtml = `<p class="detail-text">${tx.commonDesc}</p>${extraNotes}`;
            }

            modalBody.innerHTML = `
                <div class="modal-card">
                    <div class="modal-top">
                        <img class="modal-cover" src="${p.img}" alt="${name}">
                    </div>
                    <div class="modal-body">
                        ${badge ? `<div class="mini-tag">${badge}</div>` : ''}
                        <h2>${name}</h2>
                        <div class="meta-line">
                            <strong>${tx.product}:</strong> ${name}<br>
                            <strong>${tx.category}:</strong> ${getCategoryLabel(p)}<br>
                            <strong>${tx.status}:</strong> <span style="color:var(--success)">${tx.available}</span><br>
                            <strong>${tx.total}:</strong> ${formatPrice(p.price)}
                        </div>
                        <div class="feature-grid">
                            ${tx.features.map(item => `<div class="feature-item"><i class="fas fa-check-circle" style="color:var(--neon-blue);margin-inline-end:6px"></i>${item}</div>`).join('')}
                        </div>
                        <div class="section-title">${tx.description}</div>
                        ${descriptionHtml}
                        ${specs.length ? `<div class="section-title">${tx.specs}</div><ul class="detail-list">${specs.map(s => `<li>${s}</li>`).join('')}</ul>` : ''}
                        <div class="section-title">${tx.delivery}</div>
                        <p class="detail-text">${tx.commonDelivery}</p>
                        <div class="section-title">${tx.send}</div>
                        <ul class="detail-list">${tx.requestItems.map(it => `<li>${it}</li>`).join('')}</ul>
                        <div class="cta-row">
                            <button class="btn btn-primary" onclick="handleModalAddToCart(${idx})">${tx.backAdd}</button>
                            <button class="btn btn-secondary" onclick="closeModal()">${tx.close}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('detailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        function setFilter(cat, el) {
            currentFilter = cat;
            document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            // عند البحث نوقف الفلتر النشط بصرياً كي يعرف المستخدم أن البحث شامل
            if (searchQuery) {
                document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            } else {
                // أعد تنشيط الفلتر السابق
                const map = { perm:'btn-perm', normal:'btn-normal', pass:'btn-pass', acc:'btn-acc', srv:'btn-srv' };
                const active = document.getElementById(map[currentFilter]);
                if (active) active.classList.add('active');
            }
            renderProducts();
        }
        function addToCart(item) {
            const normalized = normalizeCartItem(item);
            if (!normalized) return;
            cart.push(normalized);
            persistCart();
            alert(t().added);
        }
        function persistCart() {
            localStorage.setItem('nova_cart', JSON.stringify(cart));
            localStorage.setItem('selectedLang', currentLang());
            localStorage.setItem('selectedCurrency', currentCurr());
            localStorage.setItem('exchangeRate', rates[currentCurr()]);
            updateCartCount();
        }
        function addProductToCart(index) {
            const p = products[index];
            if (!p) return;
            addToCart({
                name: currentLang() === 'ar' ? p.nameAr : p.nameEn,
                nameAr: p.nameAr, nameEn: p.nameEn,
                price: Number(p.price || 0),
                img: p.img || 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                cat: p.cat
            });
        }
        function handleModalAddToCart(idx) {
            const p = products[idx];
            if (!p) return;
            addProductToCart(idx);
            closeModal();
        }
        function openCartPage() {
            try {
                localStorage.setItem('selectedLang', currentLang());
                localStorage.setItem('selectedCurrency', currentCurr());
                localStorage.setItem('exchangeRate', rates[currentCurr()]);
            } catch(e) {}
            window.location.href = CART_PAGE_LOCAL;
        }

        // === أحداث النوافذ لمزامنة الإعدادات بين الصفحات ===
        window.addEventListener('storage', function(e) {
            if (e.key === 'selectedLang' && e.newValue) {
                document.getElementById('langSelect').value = e.newValue;
                applySettings();
            }
            if (e.key === 'selectedCurrency' && e.newValue) {
                document.getElementById('currencySelect').value = e.newValue;
                applySettings();
            }
        });
        window.addEventListener('pageshow', function() {
            // عند الرجوع إلى هذه الصفحة بصيغة bfcache
            try {
                const savedLang = localStorage.getItem('selectedLang');
                if (savedLang && document.getElementById('langSelect').value !== savedLang) {
                    document.getElementById('langSelect').value = savedLang;
                }
                const savedCurr = localStorage.getItem('selectedCurrency');
                if (savedCurr && document.getElementById('currencySelect').value !== savedCurr) {
                    document.getElementById('currencySelect').value = savedCurr;
                }
                applySettings();
            } catch(e) {}
        });

        document.addEventListener('DOMContentLoaded', function() {
            try {
                const savedLang = localStorage.getItem('selectedLang');
                if (savedLang) document.getElementById('langSelect').value = savedLang;
                const savedCurr = localStorage.getItem('selectedCurrency');
                if (savedCurr) document.getElementById('currencySelect').value = savedCurr;
            } catch(e) {}
            updateCartCount();
            applySettings();
        });

        window.onclick = function(e) {
            if (e.target === document.getElementById('detailsModal')) closeModal();
        };
    </script>
</body>
</html>
