<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Store - Blox Fruits</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main-bg: #0d1117;
            --card-bg: #161b22;
            --soft-card: #1c2128;
            --neon-blue: #00d4ff;
            --gold: #ffcc00;
            --text-gray: #97a2b0;
            --border: #30363d;
            --success: #4ade80;
            --danger: #ff6b6b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #0d1117 0%, #0b1220 100%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(13,17,23,.96);
            border-bottom: 2px solid var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-side {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .nav-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
        }
        .pill-select {
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 6px;
            color: white;
            font-size: 11px;
            outline: none;
            min-width: 78px;
        }
        .logo-img { height: 32px; display: block; }
        .cart-box {
            color: var(--gold);
            font-size: 14px;
            background: rgba(255, 204, 0, 0.08);
            padding: 7px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.25);
            cursor: pointer;
            transition: .2s ease;
        }
        .cart-box:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(255, 204, 0, .14);
        }
        .hero {
            padding: 18px 15px 8px;
            background: radial-gradient(circle at top right, rgba(0,212,255,.18), transparent 35%), #111827;
        }
        .hero h1 {
            margin: 0 0 8px;
            color: var(--neon-blue);
            font-size: 24px;
        }
        .hero p {
            margin: 0;
            color: #d1d7df;
            font-size: 13px;
            line-height: 1.8;
        }
        .search-container { padding: 15px; background: #161b22; }
        .search-box { width: 100%; position: relative; }
        .search-box input {
            width: 100%;
            background: #0d1117;
            border: 1.5px solid var(--neon-blue);
            border-radius: 20px;
            padding: 11px 15px;
            color: white;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        [dir="rtl"] .search-box input { padding-right: 38px; }
        [dir="ltr"] .search-box input { padding-left: 38px; }
        .search-box i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-blue);
        }
        [dir="rtl"] .search-box i { right: 13px; }
        [dir="ltr"] .search-box i { left: 13px; }
        .filter-container {
            background: #161b22;
            padding: 10px 6px 12px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-opt {
            background: #21262d;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 7px 16px;
            border-radius: 18px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 12px;
            flex-shrink: 0;
            transition: .2s ease;
        }
        .filter-opt.active {
            background: var(--neon-blue);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 18px rgba(0,212,255,.28);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 15px;
        }
        .product-card, .service-card {
            background: linear-gradient(180deg, rgba(22,27,34,1) 0%, rgba(19,24,31,1) 100%);
            border-radius: 18px;
            padding: 10px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(0,0,0,.2);
        }
        .product-card .thumb-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }
        .product-card img, .service-card img {
            width: 100%;
            display: block;
            object-fit: cover;
            background: #000;
        }
        .product-card img { aspect-ratio: 1/1; }
        .service-card img { aspect-ratio: 19/6; }
        .card-info-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            border: 1px solid var(--neon-blue);
            background: rgba(0,212,255,.18);
            color: var(--neon-blue);
        }
        .image-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--gold), #ff9500);
            color: #111;
            font-weight: 800;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 999px;
            box-shadow: 0 8px 16px rgba(255, 204, 0, .28);
            z-index: 3;
        }
        .mini-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            padding: 5px 8px;
            background: rgba(0,212,255,.12);
            color: var(--neon-blue);
            border: 1px solid rgba(0,212,255,.22);
            border-radius: 999px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            min-height: 36px;
            margin-bottom: 6px;
        }
        .price-line {
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .small-desc {
            color: #cad3dd;
            font-size: 11px;
            line-height: 1.7;
            min-height: 36px;
            margin-bottom: 10px;
        }
        .specs-preview {
            list-style: none;
            padding: 0;
            margin: 0 0 10px;
            display: grid;
            gap: 6px;
        }
        .specs-preview li {
            color: #d5dce5;
            font-size: 11px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.05);
            padding: 7px 9px;
            border-radius: 10px;
        }
        .btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--neon-blue);
            color: #00131b;
        }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary {
            background: rgba(255,255,255,.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,.08);
        }
        .service-card {
            grid-column: 1 / -1;
            padding: 12px;
        }
        .service-card h3 {
            margin: 12px 0 6px;
            color: #fff;
            font-size: 18px;
        }
        .service-card p {
            margin: 0 0 12px;
            color: #ccd3dd;
            font-size: 12px;
            line-height: 1.8;
        }
        .service-controls {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 12px;
            display: grid;
            gap: 10px;
        }
        .service-controls label {
            display: block;
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 5px;
        }
        .service-controls select,
        .service-controls input {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            font-family: inherit;
            outline: none;
        }
        .service-inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #dbe2ea;
        }
        .service-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(0,212,255,.10), rgba(255,204,0,.08));
            border: 1px solid rgba(0,212,255,.18);
        }
        .service-price {
            font-size: 17px;
            font-weight: 800;
            color: var(--gold);
        }
        .helper {
            color: var(--text-gray);
            font-size: 11px;
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: 20px;
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 18px;
            text-align: center;
            color: var(--text-gray);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(3, 7, 13, .92);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content {
            max-width: 820px;
            margin: 0 auto;
            min-height: 100%;
            padding: 18px;
        }
        .close-modal {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            color: var(--neon-blue);
            cursor: pointer;
            position: sticky;
            top: 12px;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .modal-card {
            background: linear-gradient(180deg, #131922 0%, #0f141b 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
        }
        .modal-top {
            padding: 18px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .modal-cover {
            width: 100%;
            border-radius: 16px;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }
        .modal-body {
            padding: 18px;
        }
        .modal-body h2 {
            margin: 12px 0 6px;
            color: var(--gold);
            font-size: 24px;
        }
        .meta-line {
            color: #dce4ee;
            font-size: 14px;
            line-height: 1.9;
        }
        .feature-grid {
            margin: 18px 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .feature-item {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 12px;
            color: #dbe4ef;
            font-size: 13px;
        }
        .section-title {
            color: var(--gold);
            margin: 22px 0 8px;
            font-size: 17px;
        }
        .detail-text {
            color: #d5dde8;
            font-size: 14px;
            line-height: 2;
        }
        .detail-list {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }
        .detail-list li {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 12px;
            padding: 11px 13px;
            color: #dbe4ee;
            font-size: 13px;
        }
        .cta-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        @media (max-width: 720px) {
            .feature-grid, .cta-row, .service-inline { grid-template-columns: 1fr; }
        }
    </style>
</head>

                send: 'Please send after ordering',
                requestItems: ['Product or service name', 'Your Roblox username or the required account details'],
                backAdd: 'Add to Cart & Return',
                close: 'Close',
                gamePassTag: 'Blox Fruits Values',
                accountTag: 'Ready account',
                serviceRules: 'Choose the amount you want and the price will be calculated automatically.',
                optionsTitle: 'Service options',
                amount: 'Requested amount',
                total: 'Total price',
                levelBoostDesc: 'Select the boost type and enter the amount. Minimum 100 for level and mastery options.',
                moneyFragmentDesc: 'Enter the target money or fragments amount and the total updates instantly, with Double Money support.',
                serviceAdd: 'Add Service to Cart',
                serviceInvalid: 'Please enter a valid amount that meets the minimum.',
                noResults: 'No matching results right now.',
                from: 'Starting from',
                specs: 'Specs',
                serviceSummary: 'Order summary',
                strongest: 'Strongest Account'
            }
        };

        const serviceOptions = {
            levelBoost: {
                ar: [
                    { key: 'level', label: 'رفع لفل الحساب', unit: '100 لفل', rate: 1.25, min: 100, step: 100, helper: 'الحد الأدنى 100 لفل — السعر 1.25$ لكل 100 لفل' },
                    { key: 'style', label: 'رفع ماستري السيف / السلاح / Fighting Style', unit: '100 ماستري', rate: 1.00, min: 100, step: 100, helper: 'الحد الأدنى 100 ماستري — السعر 1.00$ لكل 100 ماستري' },
                    { key: 'fruit', label: 'رفع ماستري الفاكهة', unit: '100 ماستري', rate: 1.50, min: 100, step: 100, helper: 'الحد الأدنى 100 ماستري — السعر 1.50$ لكل 100 ماستري' }
                ],
                en: [
                    { key: 'level', label: 'Account level boost', unit: '100 levels', rate: 1.25, min: 100, step: 100, helper: 'Minimum 100 levels — $1.25 per 100 levels' },
                    { key: 'style', label: 'Sword / weapon / fighting-style mastery boost', unit: '100 mastery', rate: 1.00, min: 100, step: 100, helper: 'Minimum 100 mastery — $1.00 per 100 mastery' },
                    { key: 'fruit', label: 'Fruit mastery boost', unit: '100 mastery', rate: 1.50, min: 100, step: 100, helper: 'Minimum 100 mastery — $1.50 per 100 mastery' }
                ]
            },
            moneyFragment: {
                ar: [
                    { key: 'money', label: 'تجميع فلوس', unit: '1 مليون', rate: 2.00, min: 1, step: 1, helper: '2$ لكل مليون — أو 1$ لكل مليون إذا تم اختيار دبل موني' },
                    { key: 'fragment', label: 'تجميع فراغمنت', unit: '1000 فراغمنت', rate: 1.00, min: 2000, step: 1000, helper: '1$ لكل 1000 فراغمنت — الحد الأدنى 2000' }
                ],
                en: [
                    { key: 'money', label: 'Money collection', unit: '1 million', rate: 2.00, min: 1, step: 1, helper: '$2 per million — or $1 per million with Double Money selected' },
                    { key: 'fragment', label: 'Fragment collection', unit: '1000 fragments', rate: 1.00, min: 2000, step: 1000, helper: '$1 per 1000 fragments — minimum 2000' }
                ]
            }
        };

        function currentLang() {
            return document.getElementById('lang').value || 'ar';
        }
        function currentCurr() {
            return document.getElementById('currency').value || 'USD';
        }
        function t() {
            return texts[currentLang()];
        }
        function formatPrice(price) {
            const curr = currentCurr();
            return `${(price * rates[curr]).toFixed(2)} ${symbols[curr]}`;
        }
        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }
        function syncCartSettings() {
            localStorage.setItem('selectedLang', currentLang());
            localStorage.setItem('selectedCurrency', currentCurr());
            localStorage.setItem('exchangeRate', rates[currentCurr()]);
        }
        function saveSettings() {
            localStorage.setItem('nova_lang', currentLang());
            localStorage.setItem('nova_curr', currentCurr());
            syncCartSettings();
            applySettings();
        }
        function applySettings() {
            const lang = localStorage.getItem('nova_lang') || localStorage.getItem('selectedLang') || 'ar';
            const curr = localStorage.getItem('nova_curr') || localStorage.getItem('selectedCurrency') || 'USD';
            document.getElementById('lang').value = lang;
            document.getElementById('currency').value = curr;
            document.getElementById('mainHtml').dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('heroTitle').innerText = texts[lang].heroTitle;
            document.getElementById('heroText').innerText = texts[lang].heroText;
            document.getElementById('btn-perm').innerText = texts[lang].filters[0];
            document.getElementById('btn-normal').innerText = texts[lang].filters[1];
            document.getElementById('btn-pass').innerText = texts[lang].filters[2];
            document.getElementById('btn-acc').innerText = texts[lang].filters[3];
            document.getElementById('btn-srv').innerText = texts[lang].filters[4];
            document.getElementById('searchInput').placeholder = texts[lang].search;
            renderProducts();
        }

        function getCommonDescription(product) {
            const lang = currentLang();
            if (product.cat === 'perm') {
                return lang === 'ar'
                    ? `احصل على ${product.nameAr} بشكل دائم داخل لعبة Blox Fruits مع تسليم سريع وترتيب واضح للطلب.`
                    : `Get ${product.nameEn} permanently in Blox Fruits with fast delivery and a clear order flow.`;
            }
            if (product.cat === 'normal') {
                return lang === 'ar'
                    ? `احصل على ${product.nameAr} كفاكهة عادية داخل اللعبة، مناسبة للاستخدام أو التخزين أو التبادل.`
                    : `Get ${product.nameEn} as a physical in-game fruit for use, storage, or trading.`;
            }
            return t().commonDesc;
        }

        function getCategoryLabel(product) {
            const lang = currentLang();
            if (product.cat === 'perm') return lang === 'ar' ? 'فاكهة دائمة' : 'Permanent Fruit';
            if (product.cat === 'normal') return lang === 'ar' ? 'فاكهة عادية' : 'Normal Fruit';
            if (product.cat === 'pass') return lang === 'ar' ? 'قيم باس' : 'Game Pass';
            if (product.cat === 'acc') return lang === 'ar' ? 'حساب Roblox' : 'Roblox Account';
            return lang === 'ar' ? 'خدمة' : 'Service';
        }

        function persistCart() {
            localStorage.setItem('nova_cart', JSON.stringify(cart));
            syncCartSettings();
            updateCartCount();
        }

        function addToCart(item) {
            const normalized = normalizeCartItem(item);
            if (!normalized) return;
            cart.push(normalized);
            persistCart();
            alert(t().added);
        }

        function addProductToCart(index) {
            const p = products[index];
            if (!p) return;
            addToCart({
                name: currentLang() === 'ar' ? p.nameAr : p.nameEn,
                price: Number(p.price || 0),
                img: p.img || 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                cat: p.cat,
                nameAr: p.nameAr,
                nameEn: p.nameEn
            });
        }

        function handleModalAddToCart(index) {
            const p = products[index];
            if (!p) return;
            if (p.cat === 'srv') {
                closeModal();
                setFilter('srv', document.getElementById('btn-srv'));
                return;
            }
            addProductToCart(index);
            closeModal();
        }

        function openCartPage() {
            syncCartSettings();
            window.location.href = CART_PAGE_LOCAL;
        }

        function getSearchBlob(product) {
            let blob = `${product.nameAr || ''} ${product.nameEn || ''}`;
            if (product.specsAr) blob += ' ' + product.specsAr.join(' ');
            if (product.specsEn) blob += ' ' + product.specsEn.join(' ');
            return blob.toLowerCase();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const lang = currentLang();
            const filtered = products.filter(p => p.cat === currentFilter && getSearchBlob(p).includes(searchQuery));

            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state">${t().noResults}</div>`;
                return;
            }

            filtered.forEach((p, idx) => {
                const originalIndex = products.findIndex(item => item.nameAr === p.nameAr && item.cat === p.cat);
                if (p.cat === 'srv') {
                    grid.innerHTML += renderServiceCard(p, originalIndex);
                } else {
                    const tag = p.cat === 'pass' ? t().gamePassTag : (p.cat === 'acc' ? t().accountTag : '');
                    const badge = lang === 'ar' ? p.badgeAr : p.badgeEn;
                    const previewSpecs = (lang === 'ar' ? p.specsAr : p.specsEn) || [];
                    grid.innerHTML += `
                        <div class="product-card">
                            <div class="thumb-wrap">
                                <div class="card-info-btn" onclick="openDetails(${originalIndex})"><i class="fas fa-info"></i></div>
                                ${badge ? `<div class="image-badge">${badge}</div>` : ''}
                                <img src="${p.img}" alt="${lang === 'ar' ? p.nameAr : p.nameEn}">
                            </div>
                            ${tag ? `<div class="mini-tag"><i class="fas fa-bolt"></i>${tag}</div>` : ''}
                            <div class="card-title">${lang === 'ar' ? p.nameAr : p.nameEn}</div>
                            <div class="price-line">${formatPrice(p.price)}</div>
                            ${previewSpecs.length ? `<ul class="specs-preview">${previewSpecs.slice(0,2).map(x => `<li>${x}</li>`).join('')}</ul>` : `<div class="small-desc">${getCommonDescription(p)}</div>`}
                            <button class="btn btn-primary" onclick="addProductToCart(${originalIndex})">${t().add}</button>
                        </div>`;
                }
            });
            bindServiceCalculators();
        }

        function renderServiceCard(product, index) {
            const lang = currentLang();
            const tx = t();
            const isLevel = product.serviceType === 'levelBoost';
            const optionSet = serviceOptions[product.serviceType][lang];
            const defaultHelper = optionSet[0].helper;
            return `
                <div class="service-card">
                    <div class="thumb-wrap" style="position:relative;border-radius:16px;overflow:hidden;">
                        <div class="card-info-btn" onclick="openDetails(${index})"><i class="fas fa-info"></i></div>
                        <img src="${product.img}" alt="${lang === 'ar' ? product.nameAr : product.nameEn}">
                    </div>
                    <h3>${lang === 'ar' ? product.nameAr : product.nameEn}</h3>
                    <p>${isLevel ? tx.levelBoostDesc : tx.moneyFragmentDesc}</p>
                    <div class="service-controls" data-service-type="${product.serviceType}" data-service-name="${lang === 'ar' ? product.nameAr : product.nameEn}" data-service-img="${product.img}">
                        <div>
                            <label>${tx.optionsTitle}</label>
                            <select class="service-option-select">
                                ${optionSet.map(opt => `<option value="${opt.key}" data-rate="${opt.rate}" data-min="${opt.min}" data-step="${opt.step}" data-helper="${opt.helper}">${opt.label}</option>`).join('')}
                            </select>
                        </div>
                        <div class="service-inline">
                            <div>
                                <label>${tx.amount}</label>
                                <input type="number" class="service-amount-input" min="${optionSet[0].min}" step="${optionSet[0].step}" placeholder="${optionSet[0].min}">
                            </div>
                            <div ${isLevel ? 'style="display:none"' : ''}>
                                <label>${lang === 'ar' ? 'خيار إضافي' : 'Extra option'}</label>
                                ${isLevel ? '<div class="helper">&nbsp;</div>' : `<label class="checkbox-row"><input type="checkbox" class="double-money-check"> ${lang === 'ar' ? 'تفعيل دبل موني' : 'Double Money selected'}</label>`}
                            </div>
                        </div>
                        <div class="helper service-helper">${defaultHelper}</div>
                        <div class="service-summary">
                            <div>
                                <div class="helper">${tx.serviceSummary}</div>
                                <div class="service-price">${tx.total}: <span class="service-price-value">${formatPrice(0)}</span></div>
                            </div>
                            <button class="btn btn-primary service-add-btn" style="display:none">${tx.serviceAdd}</button>
                        </div>
                    </div>
                </div>`;
        }

        function calculateServiceTotal(type, selected, amount, doubleMoney) {
            if (!selected) return { valid: false, total: 0 };
            if (type === 'levelBoost') {
                if (!amount || amount < selected.min || amount % selected.step !== 0) return { valid: false, total: 0 };
                return { valid: true, total: (amount / selected.step) * selected.rate };
            }
            if (selected.key === 'money') {
                if (!amount || amount < selected.min) return { valid: false, total: 0 };
                const rate = doubleMoney ? 1.0 : 2.0;
                return { valid: true, total: amount * rate };
            }
            if (selected.key === 'fragment') {
                if (!amount || amount < selected.min || amount % selected.step !== 0) return { valid: false, total: 0 };
                return { valid: true, total: (amount / 1000) * selected.rate };
            }
            return { valid: false, total: 0 };
        }

        function bindServiceCalculators() {
            document.querySelectorAll('.service-controls').forEach(box => {
                const type = box.dataset.serviceType;
                const select = box.querySelector('.service-option-select');
                const input = box.querySelector('.service-amount-input');
                const helper = box.querySelector('.service-helper');
                const price = box.querySelector('.service-price-value');
                const addBtn = box.querySelector('.service-add-btn');
                const doubleCheck = box.querySelector('.double-money-check');
                const serviceName = box.dataset.serviceName;
                const serviceImage = box.dataset.serviceImg || 'https://i.ibb.co/5xXyd4jN/1774783408791.png';

                const update = () => {
                    const lang = currentLang();
                    const data = serviceOptions[type][lang];
                    const selected = data.find(x => x.key === select.value) || data[0];
                    helper.innerText = selected.helper;
                    input.min = selected.min;
                    input.step = selected.step;
                    input.placeholder = selected.min;
                    const amount = Number(input.value || 0);
                    const calc = calculateServiceTotal(type, selected, amount, doubleCheck ? doubleCheck.checked : false);
                    price.innerText = formatPrice(calc.total);
                    addBtn.style.display = calc.valid ? 'inline-block' : 'none';
                    addBtn.onclick = () => {
                        if (!calc.valid) {
                            alert(t().serviceInvalid);
                            return;
                        }
                        const detail = `${serviceName} - ${selected.label} - ${amount}` + ((type === 'moneyFragment' && selected.key === 'money' && doubleCheck && doubleCheck.checked) ? ` - ${lang === 'ar' ? 'مع دبل موني' : 'with Double Money'}` : '');
                        addToCart({ name: detail, price: calc.total, img: serviceImage, cat: 'srv' });
                    };
                };
                select.onchange = update;
                input.oninput = update;
                if (doubleCheck) doubleCheck.onchange = update;
                update();
            });
        }

        function openDetails(idx) {
            const p = products[idx];
            const lang = currentLang();
            const tx = t();
            const modalBody = document.getElementById('modalBody');
            const name = lang === 'ar' ? p.nameAr : p.nameEn;
            const specs = lang === 'ar' ? (p.specsAr || []) : (p.specsEn || []);
            const badge = lang === 'ar' ? p.badgeAr : p.badgeEn;
            let extraNotes = '';
            if (p.cat === 'srv') {
                extraNotes = `<p class="detail-text">${tx.serviceRules}</p>`;
            } else if (p.cat === 'acc') {
                extraNotes = `<p class="detail-text">${lang === 'ar' ? 'الحسابات تُسلم ببيانات الدخول كاملة بعد تأكيد الطلب. يفضّل تغيير كلمة المرور فور الاستلام.' : 'Accounts are delivered with full credentials after order confirmation. It is recommended to change the password immediately after receiving the account.'}</p>`;
            } else if (p.cat === 'pass') {
                extraNotes = `<p class="detail-text">${lang === 'ar' ? 'يمكن تسليم أغلب عناصر هذه الفئة عبر Gift داخل اللعبة أو حسب نوع الطلب.' : 'Most items in this category can be delivered via in-game Gift depending on the order type.'}</p>`;
            }

            modalBody.innerHTML = `
                <div class="modal-card">
                    <div class="modal-top">
                        <img class="modal-cover" src="${p.img}" alt="${name}">
                    </div>
                    <div class="modal-body">
                        ${badge ? `<div class="mini-tag">${badge}</div>` : ''}
                        <h2>${name}</h2>
                        <div class="meta-line">
                            <strong>${tx.product}:</strong> ${name}<br>
                            <strong>${tx.category}:</strong> ${getCategoryLabel(p)}<br>
                            <strong>${tx.status}:</strong> <span style="color:var(--success)">${tx.available}</span><br>
                            ${p.price ? `<strong>${tx.total}:</strong> ${formatPrice(p.price)}` : `<strong>${tx.total}:</strong> ${tx.from} ${formatPrice(p.serviceType === 'levelBoost' ? 1.00 : 1.00)}`}
                        </div>

                        <div class="feature-grid">
                            ${tx.features.map(item => `<div class="feature-item"><i class="fas fa-check-circle" style="color:var(--neon-blue);margin-inline-end:6px"></i>${item}</div>`).join('')}
                        </div>

                        <div class="section-title">${tx.description}</div>
                        <p class="detail-text">${getCommonDescription(p)}</p>
                        ${extraNotes}

                        ${specs.length ? `<div class="section-title">${tx.specs}</div><ul class="detail-list">${specs.map(s => `<li>${s}</li>`).join('')}</ul>` : ''}

                        <div class="section-title">${tx.delivery}</div>
                        <p class="detail-text">${tx.commonDelivery}</p>
                        <div class="section-title">${tx.send}</div>
                        <ul class="detail-list">${tx.requestItems.map(item => `<li>${item}</li>`).join('')}</ul>

                        <div class="cta-row">
                            <button class="btn btn-primary" onclick="handleModalAddToCart(${idx})">${p.cat === 'srv' ? tx.serviceAdd : tx.backAdd}</button>
                            <button class="btn btn-secondary" onclick="closeModal()">${tx.close}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('detailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        function setFilter(cat, el) {
            currentFilter = cat;
            document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderProducts();
        }
        window.onclick = function(e) {
            if (e.target === document.getElementById('detailsModal')) closeModal();
        };
        window.onload = function() {
            syncCartSettings();
            updateCartCount();
            applySettings();
        };
    </script>
</body>
</html>
