<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Store - Robux</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // تطبيق اللغة المحفوظة فوراً قبل رسم الصفحة لتجنب الوميض (نفس نظام index.html و blox-fruits.html)
        (function() {
            try {
                const savedLang = localStorage.getItem('selectedLang');
                const html = document.getElementById('mainHtml');
                if (savedLang === 'en') { html.dir = "ltr"; html.lang = "en"; }
                else { html.dir = "rtl"; html.lang = "ar"; }
            } catch(e) {}
        })();
    </script>
    <style>
        :root {
            --main-bg: #0d1117;
            --card-bg: #161b22;
            --soft-card: #1c2128;
            --neon-blue: #00d4ff;
            --gold: #ffcc00;
            --text-gray: #97a2b0;
            --border: #30363d;
            --success: #4ade80;
            --danger: #ff6b6b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #0d1117 0%, #0b1220 100%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(13,17,23,.96);
            border-bottom: 2px solid var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #21262d;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 7px 12px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: .2s ease;
        }
        .home-btn:hover { background: var(--neon-blue); color: #00131b; }
        .home-btn i { color: var(--gold); }
        .home-btn:hover i { color: #00131b; }
        .logo-img { height: 32px; display: block; }
        .nav-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .pill {
            display: flex;
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 20px;
            height: 32px;
            align-items: center;
            transition: 0.3s;
            overflow: hidden;
        }
        .pill:hover { border-color: var(--neon-blue); }
        .pill select {
            background: transparent;
            color: white;
            border: none;
            padding: 0 10px;
            font-family: 'Tajawal';
            font-size: 11px;
            cursor: pointer;
            outline: none;
            height: 100%;
        }
        .cart-box {
            color: var(--gold);
            font-size: 13px;
            background: rgba(255, 204, 0, 0.08);
            padding: 7px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.25);
            cursor: pointer;
            transition: .2s ease;
        }
        .cart-box:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(255,204,0,.14); }

        .hero {
            padding: 18px 15px 8px;
            background: radial-gradient(circle at top right, rgba(0,212,255,.18), transparent 35%), #111827;
        }
        .hero h1 { margin: 0 0 8px; color: var(--neon-blue); font-size: 24px; }
        .hero p { margin: 0; color: #d1d7df; font-size: 13px; line-height: 1.8; }

        .search-container { padding: 15px; background: #161b22; }
        .search-box { width: 100%; position: relative; }
        .search-box input {
            width: 100%;
            background: #0d1117;
            border: 1.5px solid var(--neon-blue);
            border-radius: 20px;
            padding: 11px 15px;
            color: white;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        [dir="rtl"] .search-box input { padding-right: 38px; }
        [dir="ltr"] .search-box input { padding-left: 38px; }
        .search-box i {
            position: absolute; top: 50%; transform: translateY(-50%); color: var(--neon-blue);
        }
        [dir="rtl"] .search-box i { right: 13px; }
        [dir="ltr"] .search-box i { left: 13px; }

        .filter-container {
            background: #161b22; padding: 10px 6px 12px; display: flex;
            overflow-x: auto; gap: 8px; border-bottom: 1px solid var(--border); scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-opt {
            background: #21262d; border: 1px solid var(--neon-blue); color: white;
            padding: 7px 16px; border-radius: 18px; cursor: pointer; white-space: nowrap;
            font-size: 12px; flex-shrink: 0; transition: .2s ease;
        }
        .filter-opt.active {
            background: var(--neon-blue); color: #000; font-weight: 800;
            box-shadow: 0 0 18px rgba(0,212,255,.28);
        }

        .notice-wrap { padding: 12px 15px 0; }
        .notice-box {
            background: linear-gradient(180deg, rgba(74,222,128,.14), rgba(34,197,94,.08));
            border: 1px solid rgba(74,222,128,.32);
            color: #cdfbe1;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.9;
            box-shadow: 0 12px 26px rgba(0,0,0,.18);
        }
        .notice-box i { color: var(--success); margin-inline-end: 8px; }

        .products-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px; padding: 15px;
        }
        .product-card {
            background: linear-gradient(180deg, rgba(22,27,34,1) 0%, rgba(19,24,31,1) 100%);
            border-radius: 18px; padding: 10px; border: 1px solid var(--border);
            position: relative; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,.2);
        }
        .product-card .thumb-wrap {
            position: relative; border-radius: 14px; overflow: hidden; background: #000;
        }
        .product-card img {
            width: 100%; display: block; object-fit: cover; background: #000;
            aspect-ratio: 1/1;
        }
        .card-info-btn {
            position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5; border: 1px solid var(--neon-blue);
            background: rgba(0,212,255,.18); color: var(--neon-blue);
        }
        .mini-tag {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 10px; padding: 5px 8px;
            background: rgba(0,212,255,.12); color: var(--neon-blue);
            border: 1px solid rgba(0,212,255,.22); border-radius: 999px;
            margin: 8px 0;
        }
        .card-title {
            font-size: 13px; font-weight: 800; line-height: 1.4;
            min-height: 36px; margin-bottom: 6px;
        }
        .price-line { color: var(--gold); font-weight: 800; margin-bottom: 10px; font-size: 15px; }
        .small-desc {
            color: #cad3dd; font-size: 11px; line-height: 1.7;
            min-height: 52px; margin-bottom: 10px;
        }
        .btn {
            width: 100%; padding: 10px 12px; border: none;
            border-radius: 11px; font-weight: 800; cursor: pointer;
            transition: .2s ease; font-family: inherit;
        }
        .btn-primary { background: var(--neon-blue); color: #00131b; }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary {
            background: rgba(255,255,255,.06); color: #fff;
            border: 1px solid rgba(255,255,255,.08);
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: 20px; background: var(--card-bg);
            border: 1px dashed var(--border); border-radius: 18px;
            text-align: center; color: var(--text-gray);
        }
        .modal {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: rgba(3, 7, 13, .92); backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content { max-width: 820px; margin: 0 auto; min-height: 100%; padding: 18px; }
        .close-modal {
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
            color: var(--neon-blue); cursor: pointer; position: sticky;
            top: 12px; margin-bottom: 10px; font-size: 24px;
        }
        .modal-card {
            background: linear-gradient(180deg, #131922 0%, #0f141b 100%);
            border: 1px solid var(--border); border-radius: 24px;
            overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.4);
        }
        .modal-top { padding: 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
        .modal-cover {
            width: 100%; border-radius: 16px; aspect-ratio: 16/9;
            object-fit: cover; background: #000;
        }
        .modal-body { padding: 18px; }
        .modal-body h2 { margin: 12px 0 6px; color: var(--gold); font-size: 24px; }
        .meta-line { color: #dce4ee; font-size: 14px; line-height: 1.9; }
        .feature-grid {
            margin: 18px 0; display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
        }
        .feature-item {
            background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px; padding: 12px;
            color: #dbe4ef; font-size: 13px;
        }
        .feature-item i { color: var(--neon-blue); margin-inline-end: 6px; }
        .section-title { color: var(--gold); margin: 22px 0 8px; font-size: 17px; }
        .detail-text { color: #d5dde8; font-size: 14px; line-height: 2; }
        .detail-text.success-note {
            background: rgba(74,222,128,.10);
            border: 1px solid rgba(74,222,128,.28);
            border-radius: 12px;
            padding: 11px 13px;
            color: #c8f5dc;
            line-height: 1.8;
        }
        .detail-text.success-note i { color: var(--success); margin-inline-end: 6px; }
        .detail-list {
            margin: 0; padding: 0; list-style: none; display: grid; gap: 10px;
        }
        .detail-list li {
            background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
            border-radius: 12px; padding: 11px 13px;
            color: #dbe4ef; font-size: 13px;
        }
        .cta-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        @media (max-width: 720px) {
            .feature-grid, .cta-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="close-modal" onclick="closeModal()">&times;</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <a href="index.html" class="home-btn" title="العودة للرئيسية / Back to Home">
                <i class="fas fa-home"></i>
                <span data-ar="العودة للرئيسية" data-en="Back to Home">العودة للرئيسية</span>
            </a>
            <img src="https://i.ibb.co/5xXyd4jN/1774783408791.png" class="logo-img" alt="Nova Store">
        </div>
        <div class="nav-controls">
            <div class="pill">
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="ar">العربية (AR)</option>
                    <option value="en">English (EN)</option>
                </select>
            </div>
            <div class="pill">
                <select id="currencySelect" onchange="changeCurrency()">
                    <option value="USD">دولار (USD $)</option>
                    <option value="EUR">يورو (EUR €)</option>
                    <option value="SAR">ريال سعودي (SAR)</option>
                    <option value="AED">درهم إماراتي (AED)</option>
                    <option value="QAR">ريال قطري (QAR)</option>
                    <option value="BHD">دينار بحريني (BHD)</option>
                    <option value="OMR">ريال عماني (OMR)</option>
                    <option value="KWD">دينار كويتي (KWD)</option>
                    <option value="EGP">جنيه مصري (EGP)</option>
                    <option value="LYD">دينار ليبي (LYD)</option>
                    <option value="MAD">درهم مغربي (MAD)</option>
                </select>
            </div>
            <div class="cart-box" onclick="openCartPage()" title="Cart / السلة"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></div>
        </div>
    </div>

    <div class="hero">
        <h1 id="heroTitle">Nova Store</h1>
        <p id="heroText">مرحبًا بك في Nova Store — وجهتك لشحن الروبوكس بسهولة، بأسعار تنافسية، وتسليم سريع، وخدمة موثوقة.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن قيمة روبوكس..." oninput="handleSearch()">
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-opt active" id="btn-pass" onclick="setFilter('pass', this)">قيم باس</div>
    </div>

    <div class="notice-wrap">
        <div class="notice-box" id="noticeBox"><i class="fas fa-circle-check"></i> الروبوكس المعروض سيصلك بالكامل مع تغطية كاملة لضريبة ال30%، ستحصل على نفس كمية الروبوكس بالضبط التي تشتريها!</div>
    </div>

    <div class="products-grid" id="productGrid"></div>

    <script>
        // معدلات الصرف الموحدّة عبر الموقع بالكامل (نفس الجدول في index.html و blox-fruits.html)
        const rates = {
            USD: 1,
            EUR: 0.93,
            SAR: 3.75,
            AED: 3.6725,
            QAR: 3.64,
            BHD: 0.376,
            OMR: 0.3845,
            KWD: 0.31,
            EGP: 54.80,  // سعر جديد
            LYD: 8.60,   // سعر جديد
            MAD: 10
        };
        const symbols = { USD: "$", EUR: "€", SAR: "ر.س", AED: "د.إ", QAR: "ر.ق", BHD: "د.ب", OMR: "ر.ع", KWD: "د.ك", EGP: "ج.م", LYD: "د.ل", MAD: "د.م" };
        const CART_PAGE_LOCAL = 'Shopbasket.html';

        const products = [
            { nameAr: '250 روبوكس', nameEn: '250 Robux', price: 3.20, img: 'https://i.ibb.co/Q3LtFsjv/20260607-195223.jpg', cat: 'pass', robux: 250 },
            { nameAr: '500 روبوكس', nameEn: '500 Robux', price: 6.50, img: 'https://i.ibb.co/fVjFsC8L/20260607-195242.jpg', cat: 'pass', robux: 500 },
            { nameAr: '1000 روبوكس', nameEn: '1000 Robux', price: 11.50, img: 'https://i.ibb.co/0y11qZ79/20260607-195259.jpg', cat: 'pass', robux: 1000 },
            { nameAr: '2500 روبوكس', nameEn: '2500 Robux', price: 26.00, img: 'https://i.ibb.co/twzQ1zGv/20260607-195318.jpg', cat: 'pass', robux: 2500 },
            { nameAr: '5000 روبوكس', nameEn: '5000 Robux', price: 47.00, img: 'https://i.ibb.co/zHCN2CMr/20260607-195331.jpg', cat: 'pass', robux: 5000 }
        ];

        const texts = {
            ar: {
                heroTitle: 'Nova Store',
                heroText: 'مرحبًا بك في Nova Store — وجهتك لشحن الروبوكس بسهولة، بأسعار تنافسية، وتسليم سريع، وخدمة موثوقة.',
                filters: ['قيم باس'],
                search: 'ابحث عن قيمة روبوكس...',
                add: 'إضافة للسلة',
                details: 'التفاصيل',
                added: 'تمت الإضافة إلى السلة',
                available: 'متاح حالياً',
                description: 'الوصف',
                delivery: 'طريقة الدفع والاستلام',
                features: [
                    { icon: 'fa-truck-fast', label: 'تسليم سريع وآمن' },
                    { icon: 'fa-headset', label: 'دعم مستمر' },
                    { icon: 'fa-credit-card', label: 'خيارات دفع مرنة' },
                    { icon: 'fa-clipboard-check', label: 'ضمان ترتيب واضح للطلب' }
                ],
                category: 'التصنيف',
                product: 'اسم المنتج',
                status: 'الحالة',
                total: 'السعر الإجمالي',
                send: 'أرسل لنا بعد الطلب',
                requestItems: ['اسم المنتج أو الخدمة', 'رابط القيم باس'],
                backAdd: 'إضافة للسلة والعودة',
                close: 'إغلاق',
                gamePassTag: 'قيم باس',
                noResults: 'لا توجد نتائج مطابقة حالياً.',
                noteBanner: 'الروبوكس المعروض سيصلك بالكامل مع تغطية كاملة لضريبة ال30%، ستحصل على نفس كمية الروبوكس بالضبط التي تشتريها!',
                robuxTaxNote: 'هذا القيم باس يغطي ضريبة 30% وسيصلك الروبوكس كاملاً دون نقص.',
                deliveryText: 'أضف المنتج إلى السلة وأكمل الطلب ثم تواصل معنا عبر أحد الوسائل المتاحة وأرسل لنا رابط القيم باس.',
                descTemplate: amount => `احصل على روبوكس بقيمة ${amount} مع تسليم سريع وترتيب واضح للطلب.`
            },
            en: {
                heroTitle: 'Nova Store',
                heroText: 'Welcome to Nova Store — your destination for easy Robux top-ups, at competitive prices, fast delivery, and reliable service.',
                filters: ['Game Pass'],
                search: 'Search for a Robux amount...',
                add: 'Add to Cart',
                details: 'Details',
                added: 'Added to cart',
                available: 'Available now',
                description: 'Description',
                delivery: 'Payment & Delivery',
                features: [
                    { icon: 'fa-truck-fast', label: 'Fast & secure delivery' },
                    { icon: 'fa-headset', label: 'Ongoing support' },
                    { icon: 'fa-credit-card', label: 'Flexible payment options' },
                    { icon: 'fa-clipboard-check', label: 'Clear order arrangement guarantee' }
                ],
                category: 'Category',
                product: 'Product name',
                status: 'Status',
                total: 'Total price',
                send: 'Send us after ordering',
                requestItems: ['Product or service name', 'Game pass link'],
                backAdd: 'Add to Cart & Return',
                close: 'Close',
                gamePassTag: 'Game Pass',
                noResults: 'No matching results right now.',
                noteBanner: "The displayed Robux will be delivered in full with complete coverage of the 30% tax — you'll receive exactly the amount you purchase!",
                robuxTaxNote: 'This game pass covers the 30% tax and you will receive the full Robux amount with no deductions.',
                deliveryText: 'Add the product to the cart, complete the order, then contact us through one of the available methods and send us the game pass link.',
                descTemplate: amount => `Get ${amount} Robux with fast delivery and a clear order arrangement.`
            }
        };

        function currentLang() {
            return document.getElementById('langSelect').value || 'ar';
        }
        function currentCurr() {
            return document.getElementById('currencySelect').value || 'USD';
        }
        function t() { return texts[currentLang()]; }
        function formatPrice(price) {
            const curr = currentCurr();
            return `${(price * rates[curr]).toFixed(2)} ${symbols[curr]}`;
        }
        function getCategoryLabel() {
            return currentLang() === 'ar' ? 'قيم باس' : 'Game Pass';
        }
        function getCommonDescription(product) {
            return t().descTemplate(product.robux);
        }
        function getSearchBlob(product) {
            return `${product.nameAr || ''} ${product.nameEn || ''} ${product.robux || ''}`.toLowerCase();
        }
        function updateCartCount() {
            const el = document.getElementById('cartCount');
            if (el) el.textContent = cart.length;
        }

        // === المزامنة مع index.html و blox-fruits.html (مفتاح مرجعي موحد) ===
        function normalizeCartItem(item) {
            if (!item) return null;
            if (typeof item === 'object' && item.name && typeof item.price !== 'undefined') return item;
            if (typeof item === 'string') {
                const matched = products.find(p => p.nameAr === item || p.nameEn === item);
                return {
                    name: matched ? matched.nameAr : item,
                    nameAr: matched ? matched.nameAr : null,
                    nameEn: matched ? matched.nameEn : null,
                    price: matched ? Number(matched.price || 0) : 0,
                    img: matched ? matched.img : 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                    cat: matched ? matched.cat : 'pass'
                };
            }
            return null;
        }
        const storedCartRaw = JSON.parse(localStorage.getItem('nova_cart')) || [];
        const cart = Array.isArray(storedCartRaw) ? storedCartRaw.map(normalizeCartItem).filter(Boolean) : [];
        localStorage.setItem('nova_cart', JSON.stringify(cart));

        let currentFilter = 'pass';
        let searchQuery = '';

        function applyTranslations(lang) {
            document.querySelectorAll('[data-ar]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const html = document.getElementById('mainHtml');
            if (lang === 'en') { html.dir = "ltr"; html.lang = "en"; }
            else { html.dir = "rtl"; html.lang = "ar"; }
            applyTranslations(lang);
            try {
                localStorage.setItem('selectedLang', lang);
                localStorage.setItem('nova_lang', lang);
            } catch(e) {}
            applySettings();
        }

        function changeCurrency() {
            const currency = document.getElementById('currencySelect').value;
            try {
                localStorage.setItem('selectedCurrency', currency);
                localStorage.setItem('exchangeRate', rates[currency]);
                localStorage.setItem('nova_curr', currency);
            } catch(e) {}
            applySettings();
        }

        function applySettings() {
            const lang = currentLang();
            document.getElementById('heroTitle').textContent = texts[lang].heroTitle;
            document.getElementById('heroText').textContent = texts[lang].heroText;
            document.getElementById('btn-pass').textContent = texts[lang].filters[0];
            document.getElementById('searchInput').placeholder = texts[lang].search;
            document.getElementById('noticeBox').innerHTML = `<i class="fas fa-circle-check"></i>${texts[lang].noteBanner}`;
            applyTranslations(lang);
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const lang = currentLang();
            const tx = t();
            // البحث الشامل يتجاوز الفلتر النشط (المنطق نفسه المستخدم في blox-fruits.html)
            const filtered = searchQuery
                ? products.filter(p => getSearchBlob(p).includes(searchQuery))
                : products.filter(p => p.cat === currentFilter);

            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state">${tx.noResults}</div>`;
                return;
            }
            filtered.forEach((p, idx) => {
                const originalIndex = products.findIndex(item => item.nameAr === p.nameAr && item.cat === p.cat);
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="thumb-wrap">
                            <div class="card-info-btn" onclick="openDetails(${originalIndex})"><i class="fas fa-info"></i></div>
                            <img src="${p.img}" alt="${lang === 'ar' ? p.nameAr : p.nameEn}">
                        </div>
                        <div class="mini-tag"><i class="fas fa-bolt"></i>${tx.gamePassTag}</div>
                        <div class="card-title">${lang === 'ar' ? p.nameAr : p.nameEn}</div>
                        <div class="price-line">${formatPrice(p.price)}</div>
                        <div class="small-desc">${getCommonDescription(p)}</div>
                        <button class="btn btn-primary" onclick="addProductToCart(${originalIndex})">${tx.add}</button>
                    </div>`;
            });
        }

        function openDetails(idx) {
            const p = products[idx];
            if (!p) return;
            const lang = currentLang();
            const tx = t();
            const name = lang === 'ar' ? p.nameAr : p.nameEn;
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-card">
                    <div class="modal-top">
                        <img class="modal-cover" src="${p.img}" alt="${name}">
                    </div>
                    <div class="modal-body">
                        <div class="mini-tag"><i class="fas fa-bolt"></i>${tx.gamePassTag}</div>
                        <h2>${name}</h2>
                        <div class="meta-line">
                            <strong>${tx.product}:</strong> ${name}<br>
                            <strong>${tx.category}:</strong> ${getCategoryLabel()}<br>
                            <strong>${tx.status}:</strong> <span style="color:var(--success)">${tx.available}</span><br>
                            <strong>${tx.total}:</strong> ${formatPrice(p.price)}
                        </div>

                        <div class="feature-grid">
                            ${tx.features.map(item => `<div class="feature-item"><i class="fas ${item.icon}"></i>${item.label}</div>`).join('')}
                        </div>

                        <div class="section-title">${tx.description}</div>
                        <p class="detail-text">${getCommonDescription(p)}</p>
                        <p class="detail-text success-note"><i class="fas fa-circle-check"></i>${currentLang() === 'ar' ? 'ملاحظة: ' : 'Note: '}${tx.robuxTaxNote}</p>

                        <div class="section-title">${tx.delivery}</div>
                        <p class="detail-text">${tx.deliveryText}</p>

                        <div class="section-title">${tx.send}</div>
                        <ul class="detail-list">${tx.requestItems.map(it => `<li>${it}</li>`).join('')}</ul>

                        <div class="cta-row">
                            <button class="btn btn-primary" onclick="handleModalAddToCart(${idx})">${tx.backAdd}</button>
                            <button class="btn btn-secondary" onclick="closeModal()">${tx.close}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('detailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        function setFilter(cat, el) {
            currentFilter = cat;
            document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            // عند البحث نزيل تفعيل جميع فلاتر التصنيف بصرياً كما في blox-fruits
            if (searchQuery) {
                document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            } else {
                const active = document.getElementById('btn-pass');
                if (active) active.classList.add('active');
            }
            renderProducts();
        }
        function persistCart() {
            localStorage.setItem('nova_cart', JSON.stringify(cart));
            localStorage.setItem('selectedLang', currentLang());
            localStorage.setItem('selectedCurrency', currentCurr());
            localStorage.setItem('exchangeRate', rates[currentCurr()]);
            updateCartCount();
        }
        function addToCart(item) {
            const normalized = normalizeCartItem(item);
            if (!normalized) return;
            cart.push(normalized);
            persistCart();
            alert(t().added);
        }
        function addProductToCart(index) {
            const p = products[index];
            if (!p) return;
            addToCart({
                name: currentLang() === 'ar' ? p.nameAr : p.nameEn,
                nameAr: p.nameAr,
                nameEn: p.nameEn,
                price: Number(p.price || 0),
                img: p.img || 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                cat: p.cat
            });
        }
        function handleModalAddToCart(index) {
            addProductToCart(index);
            closeModal();
        }
        function openCartPage() {
            try {
                localStorage.setItem('selectedLang', currentLang());
                localStorage.setItem('selectedCurrency', currentCurr());
                localStorage.setItem('exchangeRate', rates[currentCurr()]);
            } catch(e) {}
            window.location.href = CART_PAGE_LOCAL;
        }

        // === مزامنة التعليقات الحية بين الصفحات ===
        window.addEventListener('storage', function(e) {
            if (e.key === 'selectedLang' && e.newValue) {
                document.getElementById('langSelect').value = e.newValue;
                applySettings();
            }
            if (e.key === 'selectedCurrency' && e.newValue) {
                document.getElementById('currencySelect').value = e.newValue;
                applySettings();
            }
        });
        window.addEventListener('pageshow', function() {
            try {
                const savedLang = localStorage.getItem('selectedLang');
                if (savedLang && document.getElementById('langSelect').value !== savedLang) {
                    document.getElementById('langSelect').value = savedLang;
                }
                const savedCurr = localStorage.getItem('selectedCurrency');
                if (savedCurr && document.getElementById('currencySelect').value !== savedCurr) {
                    document.getElementById('currencySelect').value = savedCurr;
                }
                applySettings();
            } catch(e) {}
        });

        document.addEventListener('DOMContentLoaded', function() {
            try {
                const savedLang = localStorage.getItem('selectedLang');
                if (savedLang) document.getElementById('langSelect').value = savedLang;
                const savedCurr = localStorage.getItem('selectedCurrency');
                if (savedCurr) document.getElementById('currencySelect').value = savedCurr;
            } catch(e) {}
            updateCartCount();
            applySettings();
        });

        window.onclick = function(e) {
            if (e.target === document.getElementById('detailsModal')) closeModal();
        };
    </script>
</body>
</html>
