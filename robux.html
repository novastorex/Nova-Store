<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Store - Robux</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main-bg: #0d1117;
            --card-bg: #161b22;
            --soft-card: #1c2128;
            --neon-blue: #00d4ff;
            --gold: #ffcc00;
            --text-gray: #97a2b0;
            --border: #30363d;
            --success: #4ade80;
            --danger: #ff6b6b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #0d1117 0%, #0b1220 100%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(13,17,23,.96);
            border-bottom: 2px solid var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-side {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .nav-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
        }
        .pill-select {
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 6px;
            color: white;
            font-size: 11px;
            outline: none;
            min-width: 78px;
        }
        .logo-img { height: 32px; display: block; }
        .cart-box {
            color: var(--gold);
            font-size: 14px;
            background: rgba(255, 204, 0, 0.08);
            padding: 7px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.25);
            cursor: pointer;
            transition: .2s ease;
        }
        .cart-box:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(255, 204, 0, .14);
        }
        .hero {
            padding: 18px 15px 8px;
            background: radial-gradient(circle at top right, rgba(0,212,255,.18), transparent 35%), #111827;
        }
        .hero h1 {
            margin: 0 0 8px;
            color: var(--neon-blue);
            font-size: 24px;
        }
        .hero p {
            margin: 0;
            color: #d1d7df;
            font-size: 13px;
            line-height: 1.8;
        }
        .search-container { padding: 15px; background: #161b22; }
        .search-box { width: 100%; position: relative; }
        .search-box input {
            width: 100%;
            background: #0d1117;
            border: 1.5px solid var(--neon-blue);
            border-radius: 20px;
            padding: 11px 15px;
            color: white;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        [dir="rtl"] .search-box input { padding-right: 38px; }
        [dir="ltr"] .search-box input { padding-left: 38px; }
        .search-box i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-blue);
        }
        [dir="rtl"] .search-box i { right: 13px; }
        [dir="ltr"] .search-box i { left: 13px; }
        .filter-container {
            background: #161b22;
            padding: 10px 6px 12px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-opt {
            background: #21262d;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 7px 16px;
            border-radius: 18px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 12px;
            flex-shrink: 0;
            transition: .2s ease;
        }
        .filter-opt.active {
            background: var(--neon-blue);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 18px rgba(0,212,255,.28);
        }
        .notice-wrap {
            padding: 12px 15px 0;
        }
        .notice-box {
            background: linear-gradient(180deg, rgba(255, 204, 0, .14), rgba(255, 149, 0, .08));
            border: 1px solid rgba(255, 204, 0, .28);
            color: #ffe39b;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.9;
            box-shadow: 0 12px 26px rgba(0,0,0,.18);
        }
        .notice-box i {
            color: var(--gold);
            margin-inline-end: 8px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 15px;
        }
        .product-card {
            background: linear-gradient(180deg, rgba(22,27,34,1) 0%, rgba(19,24,31,1) 100%);
            border-radius: 18px;
            padding: 10px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(0,0,0,.2);
        }
        .thumb-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }
        .product-card img {
            width: 100%;
            display: block;
            object-fit: cover;
            background: #000;
            aspect-ratio: 1/1;
        }
        .card-info-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            border: 1px solid var(--neon-blue);
            background: rgba(0,212,255,.18);
            color: var(--neon-blue);
        }
        .mini-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            padding: 5px 8px;
            background: rgba(0,212,255,.12);
            color: var(--neon-blue);
            border: 1px solid rgba(0,212,255,.22);
            border-radius: 999px;
            margin: 8px 0;
        }
        .card-title {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            min-height: 36px;
            margin-bottom: 6px;
        }
        .price-line {
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .small-desc {
            color: #cad3dd;
            font-size: 11px;
            line-height: 1.7;
            min-height: 52px;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--neon-blue);
            color: #00131b;
        }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary {
            background: rgba(255,255,255,.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,.08);
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: 20px;
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 18px;
            text-align: center;
            color: var(--text-gray);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(3, 7, 13, .92);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content {
            max-width: 820px;
            margin: 0 auto;
            min-height: 100%;
            padding: 18px;
        }
        .close-modal {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            color: var(--neon-blue);
            cursor: pointer;
            position: sticky;
            top: 12px;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .modal-card {
            background: linear-gradient(180deg, #131922 0%, #0f141b 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
        }
        .modal-top {
            padding: 18px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .modal-cover {
            width: 100%;
            border-radius: 16px;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }
        .modal-body {
            padding: 18px;
        }
        .modal-body h2 {
            margin: 12px 0 6px;
            color: var(--gold);
            font-size: 24px;
        }
        .meta-line {
            color: #dce4ee;
            font-size: 14px;
            line-height: 1.9;
        }
        .feature-grid {
            margin: 18px 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .feature-item {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 12px;
            color: #dbe4ef;
            font-size: 13px;
        }
        .feature-item i {
            color: var(--neon-blue);
            margin-inline-end: 6px;
        }
        .section-title {
            color: var(--gold);
            margin: 22px 0 8px;
            font-size: 17px;
        }
        .detail-text {
            color: #d5dde8;
            font-size: 14px;
            line-height: 2;
        }
        .detail-list {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }
        .detail-list li {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 12px;
            padding: 11px 13px;
            color: #dbe4ee;
            font-size: 13px;
        }
        .cta-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        @media (max-width: 720px) {
            .feature-grid, .cta-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="close-modal" onclick="closeModal()">&times;</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="header">
        <div class="header-side">
            <div style="font-size:18px;color:var(--neon-blue)"><i class="fas fa-bars"></i></div>
            <img src="https://i.ibb.co/5xXyd4jN/1774783408791.png" class="logo-img" alt="Nova Store">
        </div>
        <div class="nav-controls">
            <select class="pill-select" id="lang" onchange="saveSettings()">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
            <select class="pill-select" id="currency" onchange="saveSettings()">
                <option value="USD">USD ($)</option>
                <option value="SAR">SAR (ر.س)</option>
                <option value="LYD">LYD (د.ل)</option>
                <option value="EGP">EGP (ج.م)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="KWD">KWD (د.ك)</option>
                <option value="QAR">QAR (ر.ق)</option>
                <option value="BHD">BHD (د.ب)</option>
                <option value="OMR">OMR (ر.ع)</option>
                <option value="MAD">MAD (د.م)</option>
                <option value="EUR">EUR (€)</option>
            </select>
            <div class="cart-box" onclick="openCartPage()" title="Cart / السلة"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></div>
        </div>
    </div>

    <div class="hero">
        <h1 id="heroTitle">Nova Store</h1>
        <p id="heroText">متجر روبوكس عبر القيم باس بنفس أسلوب الصفحة الأصلية، مع عرض سريع للمنتجات وسلة بسيطة وتفاصيل واضحة للطلب.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن قيمة روبوكس..." oninput="handleSearch()">
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-opt active" id="btn-pass" onclick="setFilter('pass', this)">قيم باس</div>
    </div>

    <div class="notice-wrap">
        <div class="notice-box" id="noticeBox"><i class="fas fa-triangle-exclamation"></i> الروبوكس المعروض لا يغطي ضريبة 30%</div>
    </div>

    <div class="products-grid" id="productGrid"></div>

    <script>
        const rates = { USD: 1, EUR: 0.92, SAR: 3.75, AED: 3.67, QAR: 3.64, BHD: 0.37, OMR: 0.38, KWD: 0.31, EGP: 50.0, LYD: 8.0, MAD: 10 };
        const symbols = { USD: "$", EUR: "€", SAR: "ر.س", AED: "د.إ", QAR: "ر.ق", BHD: "د.ب", OMR: "ر.ع", KWD: "د.ك", EGP: "ج.م", LYD: "د.ل", MAD: "د.م" };
        const CART_PAGE_LOCAL = 'Shopbasket.html';

        const products = [
            { nameAr: '250 روبوكس', nameEn: '250 Robux', price: 2.00, img: 'https://i.ibb.co/Q3LtFsjv/20260607-195223.jpg', cat: 'pass', robux: 250 },
            { nameAr: '500 روبوكس', nameEn: '500 Robux', price: 3.50, img: 'https://i.ibb.co/fVjFsC8L/20260607-195242.jpg', cat: 'pass', robux: 500 },
            { nameAr: '1000 روبوكس', nameEn: '1000 Robux', price: 6.50, img: 'https://i.ibb.co/0y11qZ79/20260607-195259.jpg', cat: 'pass', robux: 1000 },
            { nameAr: '2500 روبوكس', nameEn: '2500 Robux', price: 14.25, img: 'https://i.ibb.co/twzQ1zGv/20260607-195318.jpg', cat: 'pass', robux: 2500 },
            { nameAr: '5000 روبوكس', nameEn: '5000 Robux', price: 26.00, img: 'https://i.ibb.co/zHCN2CMr/20260607-195331.jpg', cat: 'pass', robux: 5000 }
        ];

        const texts = {
            ar: {
                heroTitle: 'Nova Store',
                heroText: 'متجر روبوكس عبر القيم باس بنفس أسلوب الصفحة الأصلية، مع عرض سريع للمنتجات وسلة بسيطة وتفاصيل واضحة للطلب.',
                filters: ['قيم باس'],
                search: 'ابحث عن قيمة روبوكس...',
                add: 'إضافة للسلة',
                details: 'التفاصيل',
                added: 'تمت الإضافة إلى السلة',
                available: 'متاح حالياً',
                description: 'الوصف',
                delivery: 'طريقة الدفع والاستلام',
                features: [
                    { icon: 'fa-truck-fast', label: 'تسليم سريع وآمن' },
                    { icon: 'fa-headset', label: 'دعم مستمر' },
                    { icon: 'fa-credit-card', label: 'خيارات دفع مرنة' },
                    { icon: 'fa-clipboard-check', label: 'ضمان ترتيب واضح للطلب' }
                ],
                category: 'التصنيف',
                product: 'اسم المنتج',
                status: 'الحالة',
                total: 'السعر الإجمالي',
                send: 'أرسل لنا بعد الطلب',
                requestItems: ['اسم المنتج أو الخدمة', 'رابط القيم باس'],
                backAdd: 'إضافة للسلة والعودة',
                close: 'إغلاق',
                gamePassTag: 'قيم باس',
                noResults: 'لا توجد نتائج مطابقة حالياً.',
                noteBanner: 'الروبوكس المعروض لا يغطي ضريبة 30%',
                robuxTaxNote: 'ملاحظة: هذا القيم باس لا يغطي ضريبة ال30% التي تأخذها روبلوكس',
                deliveryText: 'أضف المنتج إلى السلة و اكمل الطلب ثم تواصل معنا عبر أحد الوسائل المتاحة و ارسل لنا رابط القيم باس',
                descTemplate: amount => `احصل على روبوكس بقيمة ${amount} مع تسليم سريع وترتيب واضح للطلب.`
            },
            en: {
                heroTitle: 'Nova Store',
                heroText: 'Robux shop through game pass in the same style as the original page, with quick product browsing, a simple cart, and clear order details.',
                filters: ['Game Pass'],
                search: 'Search for a Robux amount...',
                add: 'Add to Cart',
                details: 'Details',
                added: 'Added to cart',
                available: 'Available now',
                description: 'Description',
                delivery: 'Payment & Delivery',
                features: [
                    { icon: 'fa-truck-fast', label: 'Fast & secure delivery' },
                    { icon: 'fa-headset', label: 'Ongoing support' },
                    { icon: 'fa-credit-card', label: 'Flexible payment options' },
                    { icon: 'fa-clipboard-check', label: 'Clear order arrangement guarantee' }
                ],
                category: 'Category',
                product: 'Product name',
                status: 'Status',
                total: 'Total price',
                send: 'Send us after ordering',
                requestItems: ['Product or service name', 'Game pass link'],
                backAdd: 'Add to Cart & Return',
                close: 'Close',
                gamePassTag: 'Game Pass',
                noResults: 'No matching results right now.',
                noteBanner: 'Displayed Robux does not cover the 30% tax.',
                robuxTaxNote: 'Note: this game pass does not cover the 30% tax charged by Roblox.',
                deliveryText: 'Add the product to the cart, complete the order, then contact us through one of the available methods and send us the game pass link.',
                descTemplate: amount => `Get ${amount} Robux with fast delivery and a clear order arrangement.`
            }
        };

        function currentLang() {
            return document.getElementById('lang').value || 'ar';
        }
        function currentCurr() {
            return document.getElementById('currency').value || 'USD';
        }
        function t() {
            return texts[currentLang()];
        }
        function formatPrice(price) {
            const curr = currentCurr();
            return `${(price * rates[curr]).toFixed(2)} ${symbols[curr]}`;
        }
        function getCategoryLabel() {
            return currentLang() === 'ar' ? 'قيم باس' : 'Game Pass';
        }
        function getCommonDescription(product) {
            return t().descTemplate(product.robux);
        }
        function getSearchBlob(product) {
            return `${product.nameAr} ${product.nameEn} ${product.robux}`.toLowerCase();
        }
        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }
        function syncCartSettings() {
            localStorage.setItem('selectedLang', currentLang());
            localStorage.setItem('selectedCurrency', currentCurr());
            localStorage.setItem('exchangeRate', rates[currentCurr()]);
        }
        function saveSettings() {
            localStorage.setItem('nova_lang', currentLang());
            localStorage.setItem('nova_curr', currentCurr());
            syncCartSettings();
            applySettings();
        }

        function normalizeCartItem(item) {
            if (!item) return null;
            if (typeof item === 'object' && item.name && typeof item.price !== 'undefined') return item;
            if (typeof item === 'string') {
                const matched = products.find(p => p.nameAr === item || p.nameEn === item);
                return {
                    name: matched ? matched.nameAr : item,
                    price: matched ? Number(matched.price || 0) : 0,
                    img: matched ? matched.img : 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                    cat: matched ? matched.cat : 'misc'
                };
            }
            return null;
        }

        const storedCartRaw = JSON.parse(localStorage.getItem('nova_cart')) || [];
        const cart = Array.isArray(storedCartRaw) ? storedCartRaw.map(normalizeCartItem).filter(Boolean) : [];
        localStorage.setItem('nova_cart', JSON.stringify(cart));

        let currentFilter = 'pass';
        let searchQuery = '';

        function persistCart() {
            localStorage.setItem('nova_cart', JSON.stringify(cart));
            syncCartSettings();
            updateCartCount();
        }
        function addToCart(item) {
            const normalized = normalizeCartItem(item);
            if (!normalized) return;
            cart.push(normalized);
            persistCart();
            alert(t().added);
        }
        function addProductToCart(index) {
            const p = products[index];
            if (!p) return;
            addToCart({
                name: currentLang() === 'ar' ? p.nameAr : p.nameEn,
                price: Number(p.price || 0),
                img: p.img || 'https://i.ibb.co/5xXyd4jN/1774783408791.png',
                cat: p.cat,
                nameAr: p.nameAr,
                nameEn: p.nameEn
            });
        }
        function handleModalAddToCart(index) {
            addProductToCart(index);
            closeModal();
        }
        function openCartPage() {
            syncCartSettings();
            window.location.href = CART_PAGE_LOCAL;
        }

        function applySettings() {
            const lang = localStorage.getItem('nova_lang') || localStorage.getItem('selectedLang') || 'ar';
            const curr = localStorage.getItem('nova_curr') || localStorage.getItem('selectedCurrency') || 'USD';
            document.getElementById('lang').value = lang;
            document.getElementById('currency').value = curr;
            document.getElementById('mainHtml').dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('heroTitle').innerText = texts[lang].heroTitle;
            document.getElementById('heroText').innerText = texts[lang].heroText;
            document.getElementById('btn-pass').innerText = texts[lang].filters[0];
            document.getElementById('searchInput').placeholder = texts[lang].search;
            document.getElementById('noticeBox').innerHTML = `<i class="fas fa-triangle-exclamation"></i>${texts[lang].noteBanner}`;
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const lang = currentLang();
            const filtered = products.filter(p => p.cat === currentFilter && getSearchBlob(p).includes(searchQuery));
            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state">${t().noResults}</div>`;
                return;
            }
            filtered.forEach((p, idx) => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="thumb-wrap">
                            <div class="card-info-btn" onclick="openDetails(${idx})"><i class="fas fa-info"></i></div>
                            <img src="${p.img}" alt="${lang === 'ar' ? p.nameAr : p.nameEn}">
                        </div>
                        <div class="mini-tag"><i class="fas fa-bolt"></i>${t().gamePassTag}</div>
                        <div class="card-title">${lang === 'ar' ? p.nameAr : p.nameEn}</div>
                        <div class="price-line">${formatPrice(p.price)}</div>
                        <div class="small-desc">${getCommonDescription(p)}</div>
                        <button class="btn btn-primary" onclick="addProductToCart(${idx})">${t().add}</button>
                    </div>`;
            });
        }

        function openDetails(idx) {
            const p = products[idx];
            const lang = currentLang();
            const tx = t();
            const name = lang === 'ar' ? p.nameAr : p.nameEn;
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-card">
                    <div class="modal-top">
                        <img class="modal-cover" src="${p.img}" alt="${name}">
                    </div>
                    <div class="modal-body">
                        <div class="mini-tag"><i class="fas fa-bolt"></i>${tx.gamePassTag}</div>
                        <h2>${name}</h2>
                        <div class="meta-line">
                            <strong>${tx.product}:</strong> ${name}<br>
                            <strong>${tx.category}:</strong> ${getCategoryLabel()}<br>
                            <strong>${tx.status}:</strong> <span style="color:var(--success)">${tx.available}</span><br>
                            <strong>${tx.total}:</strong> ${formatPrice(p.price)}
                        </div>

                        <div class="feature-grid">
                            ${tx.features.map(item => `<div class="feature-item"><i class="fas ${item.icon}"></i>${item.label}</div>`).join('')}
                        </div>

                        <div class="section-title">${tx.description}</div>
                        <p class="detail-text">${getCommonDescription(p)}</p>
                        <p class="detail-text">${tx.robuxTaxNote}</p>

                        <div class="section-title">${tx.delivery}</div>
                        <p class="detail-text">${tx.deliveryText}</p>

                        <div class="section-title">${tx.send}</div>
                        <ul class="detail-list">${tx.requestItems.map(item => `<li>${item}</li>`).join('')}</ul>

                        <div class="cta-row">
                            <button class="btn btn-primary" onclick="handleModalAddToCart(${idx})">${tx.backAdd}</button>
                            <button class="btn btn-secondary" onclick="closeModal()">${tx.close}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('detailsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        function setFilter(cat, el) {
            currentFilter = cat;
            document.querySelectorAll('.filter-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderProducts();
        }
        window.onclick = function(e) {
            if (e.target === document.getElementById('detailsModal')) closeModal();
        };
        window.onload = function() {
            syncCartSettings();
            updateCartCount();
            applySettings();
        };
    </script>
</body>
</html>
